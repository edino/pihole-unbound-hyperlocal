server:
    # ==============================================================================
    # PI-HOLE + UNBOUND: HYPERLOCAL RECURSIVE DNS CONFIGURATION
    # Architecture: Pi-hole v6 Native + Strict Decentralized Recursion
    # Security Profile: DNSSEC Validating + QNAME Minimisation (Layer 2 Privacy)
    # ==============================================================================

    # --------------------------------------------------------------------------
    # LOGGING & DEBUGGING
    # --------------------------------------------------------------------------
    # If no logfile is specified, syslog is used. 
    # This path maps to the container's internal log directory.
    logfile: "/var/log/unbound/unbound.log"
    
    # Verbosity level. 
    # 0: No verbosity, only errors. (Recommended for production to save disk I/O)
    # 1: Gives operational information.
    # 2: Gives detailed operational information.
    # 3: Gives query level information (useful for debugging DNS resolution failures).
    verbosity: 0

    # --------------------------------------------------------------------------
    # NETWORK BINDING & PROTOCOLS
    # --------------------------------------------------------------------------
    # Bind to localhost only. We do not want Unbound exposed to the external network.
    # Pi-hole will communicate directly with Unbound over this internal loopback address.
    interface: 127.0.0.1
    
    # The custom port Unbound listens on. We use 5335 to prevent clashing 
    # with Pi-hole/FTL, which MUST own standard port 53.
    port: 5335
    
    # Enable IPv4 resolution.
    do-ip4: yes
    # Enable UDP resolution. UDP is the primary protocol for fast DNS queries.
    do-udp: yes
    # Enable TCP resolution. TCP is required as a fallback when UDP payloads 
    # exceed maximum limits, or for DNSSEC validation.
    do-tcp: yes

    # Enable IPv6 resolution. Set to 'yes' even if your local network is IPv4 only, 
    # as Unbound needs to query authoritative servers that may only have IPv6 records.
    do-ip6: yes

    # You want to leave this to 'no' unless you have *native* IPv6 on your ISP connection.
    # If using 6to4 or Teredo tunnels, favoring IPv6 will introduce massive latency.
    prefer-ip6: no

    # --------------------------------------------------------------------------
    # PRIVILEGE SEPARATION
    # --------------------------------------------------------------------------
    # After binding to the privileged port, Unbound drops root privileges and 
    # assumes the identity of this user. This is a critical security mechanism 
    # to prevent sandbox escapes if Unbound is compromised.
    username: "unbound" 

    # --------------------------------------------------------------------------
    # ROOT SERVERS & TRUST ANCHORS (THE BACKBONE OF RECURSION)
    # --------------------------------------------------------------------------
    # The file containing the IP addresses of the 13 global DNS Root Servers (A-M).
    # Unbound requires this to begin its recursive journey to find authoritative answers.
    root-hints: "/etc/unbound/root.hints"
    
    # The cryptographic public keys used to verify the DNS root zone.
    # This file is used to validate the entire DNSSEC chain of trust.
    trust-anchor-file: "/usr/share/dnssec-root/trusted-key.key"

    # --------------------------------------------------------------------------
    # STRICT PRIVACY & QNAME MINIMISATION POLICY (Layer 2 Hardening)
    # --------------------------------------------------------------------------
    # RFC 7816: Send the minimum amount of information to upstream servers.
    # Instead of asking the Root Server for the full 'sub.domain.example.com', 
    # Unbound only asks the Root for '.com', then asks the TLD for 'example.com'.
    # This prevents Root and TLD servers from logging your specific subdomains.
    qname-minimisation: yes
    
    # RFC 8020: Stops querying if a higher-level domain is confirmed to not exist.
    # If '.invalid' doesn't exist, Unbound won't bother asking for 'server.invalid'.
    # This saves bandwidth and reduces leakage of internal/mistyped hostnames.
    harden-below-nxdomain: yes
    
    # Strip away EDNS Client Subnet (ECS) data. 
    # ECS leaks parts of your local IP subnet to authoritative servers to help them 
    # geo-locate you for CDN routing. Setting this ensures your IP subnet is stripped.
    edns-tcp-keepalive: yes

    # --------------------------------------------------------------------------
    # DNSSEC VALIDATION & SPOOFING PROTECTION
    # --------------------------------------------------------------------------
    # Trust "glue" records (IPs provided alongside name server delegations) 
    # ONLY if they fall within the domain the server is actually authoritative for.
    # This prevents a malicious server from poisoning the cache with fake IPs.
    harden-glue: yes

    # Require DNSSEC data for trust-anchored zones.
    # If a domain is known to be DNSSEC signed, but the signature is missing or broken, 
    # Unbound will aggressively mark the response as BOGUS and refuse to resolve it.
    harden-dnssec-stripped: yes

    # Don't use Capitalization randomization (0x20 encoding).
    # While good for security in theory, it is known to break DNSSEC validation 
    # on many poorly configured authoritative servers across the internet.
    use-caps-for-id: no

    # --------------------------------------------------------------------------
    # PERFORMANCE TUNING & BUFFER MANAGEMENT
    # --------------------------------------------------------------------------
    # Limit the maximum UDP payload size.
    # 1232 bytes is the optimal value determined by DNS Flag Day 2020. It prevents 
    # IP fragmentation on typical network links, ensuring reliable and secure UDP delivery.
    # Responses larger than 1232 bytes will cleanly fallback to TCP.
    edns-buffer-size: 1232

    # Perform prefetching of close-to-expired message cache entries.
    # If a highly popular domain (like google.com) is about to expire from cache, 
    # Unbound will fetch the new IP *before* it expires, ensuring zero wait time for users.
    prefetch: yes

    # Fetch the DNSKEYs earlier in the validation process when a DS record is encountered. 
    # This lowers the latency of DNSSEC validation requests at the cost of slight CPU usage.
    prefetch-key: yes

    # CPU threading allocation.
    # 1 thread is mathematically optimal for almost all homelab and small network environments. 
    # Increasing this only introduces lock-contention overhead unless dealing with massive enterprise traffic.
    num-threads: 1

    # Ensure the kernel socket receive buffer is large enough to not drop 
    # incoming UDP packets during sudden traffic spikes.
    so-rcvbuf: 1m

    # Memory allocation for the internal caches.
    # The rrset-cache (Resource Record Sets) should generally be configured to be 
    # exactly twice the size of the msg-cache (Message Cache).
    msg-cache-size: 128m
    rrset-cache-size: 256m

    # Aggressive NSEC (Negative Caching).
    # Uses the DNSSEC NSEC chain to synthesize NXDOMAIN (Domain Not Found) answers 
    # based on previous queries. Massively reduces outbound traffic for bad domains.
    aggressive-nsec: yes

    # --------------------------------------------------------------------------
    # IDENTITY CONCEALMENT & LOCAL NETWORK SECURITY
    # --------------------------------------------------------------------------
    # If enabled, queries probing for the server's identity (id.server) are refused.
    # Prevents network scanners from fingerprinting your infrastructure.
    hide-identity: yes
    
    # If enabled, queries probing for the software version (version.server) are refused.
    # Prevents attackers from identifying known CVE vulnerabilities based on version numbers.
    hide-version: yes

    # Protect private IP ranges from DNS Rebinding attacks.
    # Unbound will instantly strip and reject any public DNS response that 
    # attempts to resolve to one of these private, local network IP addresses.
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: 172.16.0.0/12
    private-address: 10.0.0.0/8
    private-address: fd00::/8
    private-address: fe80::/10

    # --------------------------------------------------------------------------
    # LAZARUS TCP FORTIFICATION (Pi-hole Integration Fix)
    # --------------------------------------------------------------------------
    # Prevents Unbound from prematurely closing TCP connections that Pi-hole/FTL 
    # expects to remain open, resolving "Connection prematurely closed" log spam.
    incoming-num-tcp: 1024
    tcp-idle-timeout: 30000
