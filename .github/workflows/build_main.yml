name: build prod image

on:
  push:
    branches: [ main ]

# MANDATORY: Grants this workflow permission to write packages to your registry
permissions:
  contents: read
  packages: write

jobs:
  build-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up variables
        run: |
          VER=$(cat ./docker-build/VERSION)
          echo "VERSION=$VER" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./docker-build
          file: ./docker-build/Dockerfile
          platforms: |
            linux/amd64
            linux/arm/v7
            linux/arm64
            linux/riscv64
          push: true
          # Tags are now dynamically generated using the repository owner name
          tags: | 
            ghcr.io/${{ github.repository_owner }}/pihole-unbound-hyperlocal:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/pihole-unbound-hyperlocal:latest
